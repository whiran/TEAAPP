apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ceylon-tea-frontend
  labels:
    app: ceylon-tea
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ceylon-tea-frontend
  labels:
    app: ceylon-tea
spec:
  source:
    type: Git
    git:
      uri: https://github.com/whiran/TEAAPP.git
    contextDir: frontend
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      # Next.js standalone build targets
      buildArgs:
        - name: NEXT_PUBLIC_API_URL
          value: https://ceylon-tea-backend-sltb-tvcs.apps.sovecloud.akaza.lk
        - name: NEXT_PUBLIC_MP_WINDY_API_KEY
          value: ""
  output:
    to:
      kind: ImageStreamTag
      name: ceylon-tea-frontend:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChange: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceylon-tea-frontend
  labels:
    app: ceylon-tea
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ceylon-tea
      component: frontend
  template:
    metadata:
      labels:
        app: ceylon-tea
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ceylon-tea-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ceylon-tea-frontend
  labels:
    app: ceylon-tea
    component: frontend
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: ceylon-tea
    component: frontend
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ceylon-tea-frontend
  labels:
    app: ceylon-tea
    component: frontend
spec:
  to:
    kind: Service
    name: ceylon-tea-frontend
  port:
    targetPort: 3000
  tls:
    termination: edge
